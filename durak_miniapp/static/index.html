<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Дурак — Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">♠</span><span>ДУРАК</span></div>
    <div class="status"><span id="connectionDot"></span><span id="connectionText">Подключение…</span></div>
  </header>

  <main class="table-wrap">
    <section class="game-table" id="table">
      <div class="felt-glow"></div>
      <div class="players" id="players"></div>

      <div class="center">
        <div class="deck-zone">
          <div class="deck-card back" id="deckCard"><span id="deckCount">0</span></div>
          <div class="trump-label">КОЗЫРЬ</div>
          <div class="trump-card card" id="trumpCard">—</div>
        </div>
        <div class="table-cards" id="tableCards"></div>
        <div class="message" id="message">Подключение…</div>
        <div class="event" id="event"></div>
      </div>
    </section>
  </main>

  <section class="bottom-panel">
    <div class="actions" id="actions"></div>
    <div class="hand-title"><span>Ваши карты</span><span id="hint">Нажмите на карту</span></div>
    <div class="hand" id="hand"></div>
  </section>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <div class="modal-icon">🃏</div>
      <h2 id="modalTitle">Дурак</h2>
      <p id="modalText"></p>
      <button id="modalButton">ОК</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
