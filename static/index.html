<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <title>ДУРАК</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" aria-label="Закрыть">×</button>
    <div class="title-group">
      <div class="eyebrow">PRIVATE TABLE</div>
      <div class="title">ДУРАК</div>
    </div>
    <div class="top-right">
      <div class="round-pill" id="roundPill">ЛОББИ</div>
      <button class="icon-btn" id="soundBtn" aria-label="Звук">🔊</button>
    </div>
  </header>

  <main class="arena">
    <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
    <section class="table" id="table">
      <div class="table-inner">
        <div class="opponents" id="opponents"></div>
        <div class="felt-logo">♠</div>
        <div class="center-stage">
          <div class="top-meta">
            <div class="deck-wrap">
              <div class="deck back" id="deck"><span id="deckCount">0</span></div>
              <div class="deck-shadow"></div>
            </div>
            <div class="trump-wrap">
              <div class="tiny-label">КОЗЫРЬ</div>
              <div id="trumpSlot" class="trump-slot">—</div>
            </div>
          </div>
          <div class="turn-banner" id="turnBanner">Подключение к столу…</div>
          <div class="board" id="board"></div>
          <div class="event-chip" id="eventChip"></div>
        </div>
        <div class="my-seat" id="mySeat">
          <div class="you-ring"></div>
          <div class="me-avatar" id="meAvatar">?</div>
          <div class="me-name" id="meName">Вы</div>
          <div class="me-role" id="meRole">ожидание</div>
        </div>
      </div>
    </section>

    <section class="hud">
      <div class="hud-line">
        <div><span class="tiny-label">СТОЛ</span><strong id="roomCode">—</strong></div>
        <div class="hud-actions">
          <button class="mini-btn" id="inviteBtn">↗ Позвать</button>
          <button class="mini-btn ghost" id="copyBtn">⧉</button>
        </div>
      </div>
      <div class="status-text" id="statusText">Создайте игру и отправьте ссылку друзьям.</div>
    </section>

    <section class="hand-zone">
      <div class="hand-head">
        <div><span class="tiny-label">ВАША РУКА</span><span class="selection-count" id="selectionText"></span></div>
        <div class="hint" id="hint">Выберите карту</div>
      </div>
      <div class="hand" id="hand"></div>
    </section>
  </main>

  <footer class="bottom">
    <div class="action-row" id="actions"></div>
  </footer>

  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
